name: Release

# Builds the mod and publishes a GitHub release with the jar, tagged v<mod_version>.
# Runs when a tag like v0.2.0 is pushed, or by hand from the Actions tab (which creates the tag).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Read the version
        id: version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match mod_version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Erebus v${{ steps.version.outputs.version }}
          body_path: .github/release-notes.md
          files: build/libs/erebus-${{ steps.version.outputs.version }}.jar
          fail_on_unmatched_files: true
